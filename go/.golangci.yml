# golangci-lint configuration (schema v2). Run: make lint
#
# `make ci` runs this, so a new finding fails the gate rather than accumulating. Note that
# on the v2 schema `staticcheck` subsumes the former gosimple and stylecheck checks, so the
# S* and ST* diagnostics are part of this set.
version: "2"

linters:
  enable:
    - depguard
    - misspell
    - revive
    # errcheck, govet, ineffassign, staticcheck and unused are enabled by default.

  settings:
    depguard:
      rules:
        # Tooling packages must not depend on agent packages (also enforced by ARCH tests).
        tooling-no-agents:
          list-mode: lax
          files:
            - "**/internal/githubapi/**"
            - "**/internal/gitrepo/**"
            - "**/internal/webhook/**"
            - "**/internal/notify/**"
            - "**/internal/obs/**"
            - "**/internal/tasks/**"
          deny:
            - pkg: "automation-agent/internal/agent"
              desc: "tooling must not import agent packages"

  exclusions:
    rules:
      # A test asserting on a call's side effect routinely ignores its error return.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - automation-agent

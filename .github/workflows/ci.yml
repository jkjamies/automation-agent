# The Go gate, run on every push and pull request.
#
# Two jobs. `go` is the main gate: one step running the same `make ci` a developer runs
# locally, so the hosted gate cannot drift from the Makefile. `firestore` runs the
# emulator-gated suite that covers the cloud session and park-store backends — they are
# skipped entirely without an emulator, which left the whole production durability path
# (internal/agent/setup drops from ~82% to ~41% without it) unexecuted.
#
# Still not run here: anything that calls a real model.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      # No step here runs an authenticated git command — `make ci` and `make cover-firestore`
      # only read the tree and run tests, and the `git diff` below is purely local. So do not
      # leave the workflow token behind in .git/config, where any later step (or a dependency
      # invoked by one) could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the toolchain: the module's own go directive.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # golangci-lint is built from source against this module's toolchain (see the Makefile
      # for why a released binary will not do), so cache the built binary rather than paying
      # for the build on every run. Keyed on the pinned version + the toolchain that built it.
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go/Makefile', 'go/go.mod') }}

      # tidy + vet + lint + arch + test + coverage gate.
      - run: make ci

      # `make ci` starts with `go mod tidy`, which rewrites go.mod/go.sum in place. Fail if it
      # changed anything, so drift is caught here instead of landing silently. Formatting is
      # not part of this check: golangci-lint *reports* gofmt/goimports violations rather than
      # applying them (only `--fix` writes), so unformatted code fails the lint step above and
      # never reaches here.
      - name: Check for uncommitted changes
        run: git diff --exit-code

  # The cloud backends (session service + park store) only execute against a Firestore
  # emulator; without one their tests are skipped, so the durability path the production
  # deployment depends on would never run. Separate job so a failure here is
  # distinguishable from the main gate, and so it cannot slow it down.
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      # No step here runs an authenticated git command — `make ci` and `make cover-firestore`
      # only read the tree and run tests, and the `git diff` below is purely local. So do not
      # leave the workflow token behind in .git/config, where any later step (or a dependency
      # invoked by one) could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The standalone emulator jar, so this needs no gcloud SDK install — just the JRE
      # ubuntu-latest already ships. Cached because it is ~64 MB and versioned.
      - name: Cache Firestore emulator
        id: emulator-cache
        uses: actions/cache@v4
        with:
          path: ~/firestore-emulator.jar
          key: firestore-emulator-v1.19.8
      # The digest is verified on every run, cache hit or not: the next step executes this jar
      # as code, and a poisoned cache entry is as dangerous as a poisoned download. The URL
      # pins a version, but a version can be republished. Bump both together on upgrade.
      - name: Download Firestore emulator
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o ~/firestore-emulator.jar https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar

      - name: Verify Firestore emulator
        run: echo "9d43599ed6151199e8d604dc87fac51218e49e5f3a48519b1ae560bbe5e3382d  $HOME/firestore-emulator.jar" | sha256sum -c -

      - name: Start Firestore emulator
        run: |
          java -jar ~/firestore-emulator.jar --host=127.0.0.1 --port=8765 &
          # Poll rather than sleep a fixed interval: the emulator takes a few seconds to
          # bind, and a fixed wait is either flaky or wasteful.
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          echo "Firestore emulator did not come up" >&2
          exit 1

      - name: Run the emulator-backed suite
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8765
        run: make cover-firestore
